# LEARNING / DEMO EXAMPLE ONLY.
#
# This file is committed with PLACEHOLDER values so the manifest set is
# complete and self-documenting. Do NOT apply it as-is to a real cluster,
# and NEVER commit real credentials to source control - even in a private
# repo. In a real deployment, generate this at apply-time instead, e.g.:
#
#   kubectl create secret generic employee-secret \
#     --namespace employee-app \
#     --from-literal=DATABASE_USER=empadmin \
#     --from-literal=DATABASE_PASSWORD="$(openssl rand -base64 24)" \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# or, better, pull the values from Azure Key Vault via the AKS Key Vault
# Provider for Secrets Store CSI Driver (see "Enterprise Evolution -
# Level 3" in the README). Keys match backend/app/config.py exactly, so
# this can be loaded with `envFrom: secretRef` with no code changes.
apiVersion: v1
kind: Secret
metadata:
  name: employee-secret
  namespace: employee-app
  labels:
    app.kubernetes.io/part-of: employee-management-system
type: Opaque
stringData:
  DATABASE_USER: "empadmin"
  DATABASE_PASSWORD: "Employee@2026"
