# FastAPI backend - the SAME Docker image/source as backend/Dockerfile,
# just deployed to AKS instead of the VM. No application code changes.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: employee-app
  labels:
    app: backend
    app.kubernetes.io/part-of: employee-management-system
spec:
  replicas: 1
  strategy:
    # RollingUpdate: replace old Pods with new ones gradually instead of
    # all at once. With replicas=2, maxUnavailable=1/maxSurge=1 means at
    # most 1 Pod is down and at most 1 extra Pod exists at any point during
    # a rollout - i.e. capacity never drops below 1 healthy Pod
    # (near-zero downtime). See README "Rolling Deployment" for the walkthrough.
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        app.kubernetes.io/part-of: employee-management-system
    spec:
      securityContext:
        # The image already runs as a non-root "appuser" (see
        # backend/Dockerfile "USER appuser"); this just asserts and
        # enforces that at the Kubernetes level too.
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          # Placeholder name resolved by kustomization.yaml's "images:"
          # transformer to <ACR_LOGIN_SERVER>/employee-backend:<TAG>.
          image: employee-backend-image:latest
          ports:
            - containerPort: 8000
              name: http
          # Every key in employee-config/employee-secret becomes an env
          # var with the SAME name the app already expects
          # (backend/app/config.py) - zero code changes required.
          envFrom:
            - configMapRef:
                name: employee-config
            - secretRef:
                name: employee-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # readOnlyRootFilesystem needs a writable /tmp for Python/Uvicorn.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
