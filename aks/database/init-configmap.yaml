# Generated FROM database/init.sql - the single source of truth for the
# schema (same file used by the VM's docker-compose Postgres container).
# Do not hand-edit this file's data block; regenerate it instead with:
#
#   kubectl create configmap postgres-init-script \
#     --namespace employee-app \
#     --from-file=init.sql=database/init.sql \
#     --dry-run=client -o yaml > aks/database/init-configmap.yaml
#
# Mounted into the PostgreSQL container at /docker-entrypoint-initdb.d/,
# where the official postgres image executes it automatically the first
# time the PVC is empty (identical behavior to the VM deployment).
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-script
  namespace: employee-app
  labels:
    app.kubernetes.io/part-of: employee-management-system
data:
  init.sql: |
    -- Employee Management System - initial schema + seed data.
    -- Automatically executed by the official postgres image on first container
    -- start (mounted into /docker-entrypoint-initdb.d/). The FastAPI backend
    -- also has a safety-net create_all() call, so this is idempotent either way.

    CREATE TABLE IF NOT EXISTS employees (
        id             SERIAL PRIMARY KEY,
        employee_id    VARCHAR(20)  UNIQUE NOT NULL,
        first_name     VARCHAR(50)  NOT NULL,
        last_name      VARCHAR(50)  NOT NULL,
        email          VARCHAR(120) UNIQUE NOT NULL,
        department     VARCHAR(50)  NOT NULL,
        designation    VARCHAR(80)  NOT NULL,
        salary         NUMERIC(10, 2) NOT NULL CHECK (salary > 0),
        status         VARCHAR(20)  NOT NULL DEFAULT 'active' CHECK (status IN ('active', 'inactive')),
        joining_date   DATE NOT NULL,
        created_at     TIMESTAMPTZ NOT NULL DEFAULT now(),
        updated_at     TIMESTAMPTZ NOT NULL DEFAULT now()
    );

    CREATE INDEX IF NOT EXISTS idx_employees_department ON employees (department);
    CREATE INDEX IF NOT EXISTS idx_employees_status     ON employees (status);
    CREATE INDEX IF NOT EXISTS idx_employees_email      ON employees (email);

