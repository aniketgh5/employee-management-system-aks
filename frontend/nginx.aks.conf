# Employee Management System - AKS frontend container Nginx config.
#
# Unlike nginx/nginx.conf (used for the VM deployment, where one Nginx
# container both serves the frontend AND reverse-proxies /api to the
# backend), this config ONLY serves static files. In AKS, path-based
# routing to the backend is handled by the Ingress resource instead
# (see aks/ingress/ingress.yaml), so this container never talks to the
# backend directly.
server_tokens off;

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Lightweight liveness/readiness endpoint for the frontend Pod itself.
    # This is separate from the application-level /health path exposed
    # through the Ingress, which is routed to the backend service.
    location /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ~ /\. {
        deny all;
    }
}
