# Employee Management System - Nginx reverse proxy configuration
#
# Responsibilities:
#   1. Serve the static frontend (HTML/CSS/JS)
#   2. Reverse-proxy /api/*  -> backend:8000  (FastAPI, via Docker DNS)
#   3. Reverse-proxy /health -> backend:8000
#   4. Reverse-proxy /docs and /openapi.json -> backend:8000 (Swagger UI)

server_tokens off;

server {
    listen 80;
    server_name _;

    client_max_body_size 5m;

    # --- Basic security headers ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /usr/share/nginx/html;
    index index.html;

    # --- Frontend (static files) ---
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Backend REST API ---
    # Uses the Docker Compose service name "backend" (Docker's internal DNS),
    # never localhost - localhost inside the nginx container is the nginx
    # container itself, not the backend container.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # --- Health checks (proxied so they can be checked from outside too) ---
    location /health {
        proxy_pass http://backend:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    # --- Swagger / OpenAPI docs ---
    location /docs {
        proxy_pass http://backend:8000/docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://backend:8000/openapi.json;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Deny access to dotfiles
    location ~ /\. {
        deny all;
    }
}
