# Setup: docs/azure-devops-aks.md
trigger:
  batch: true
  branches:
    include: [main]
pr:
  branches:
    include: [main]

variables:
  azureServiceConnection: 'azure-employee-aks'
  acrName: 'aniketghoshacr'
  acrLoginServer: 'aniketghoshacr.azurecr.io'
  aksResourceGroup: 'aniketghosh-aks-rg'
  aksClusterName: 'aniketghosh-aks'
  backendImage: 'employee-api'
  frontendImage: 'employee-frontend'
  imageTag: '$(Build.BuildId)-$(Build.SourceVersion)'
  pythonVersion: '3.12'
  kubectlVersion: '1.35.0'

pool:
  vmImage: ubuntu-24.04

stages:
  - stage: Test
    jobs:
      - job: BackendTests
        steps:
          - checkout: self
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '$(pythonVersion)'
          - bash: |
              set -euo pipefail
              python -m pip install -r backend/requirements.txt
              cd backend
              python -m pytest --junitxml=test-results.xml
            displayName: Run backend tests
          - task: PublishTestResults@2
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: backend/test-results.xml
              failTaskOnFailedTests: true

  - stage: Build
    dependsOn: Test
    jobs:
      - job: BuildAndPush
        steps:
          - checkout: self
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '$(pythonVersion)'
          - task: KubectlInstaller@0
            inputs:
              kubectlVersion: '$(kubectlVersion)'
          - bash: |
              set -euo pipefail
              docker build --pull -f backend/Dockerfile -t "$BACKEND_REF" backend
              docker build --pull -f frontend/Dockerfile -t "$FRONTEND_REF" frontend
              python -m pip install PyYAML==6.0.3
              python scripts/ci/render-aks.py aks "$OUTPUT_DIR" "$BACKEND_REF" "$FRONTEND_REF"
              kubectl kustomize "$OUTPUT_DIR" > "$OUTPUT_DIR/rendered.yaml"
            displayName: Build both images and render deployment artifact
            env:
              BACKEND_REF: '$(acrLoginServer)/$(backendImage):$(imageTag)'
              FRONTEND_REF: '$(acrLoginServer)/$(frontendImage):$(imageTag)'
              OUTPUT_DIR: '$(Build.ArtifactStagingDirectory)/aks'
          # Build and push run on the same agent: no lost Docker images between jobs.
          - task: AzureCLI@2
            displayName: Push release images to ACR
            condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'), ne(variables['Build.Reason'], 'PullRequest'))
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                az acr login --name "$ACR_NAME"
                docker push "$BACKEND_REF"
                docker push "$FRONTEND_REF"
            env:
              ACR_NAME: '$(acrName)'
              BACKEND_REF: '$(acrLoginServer)/$(backendImage):$(imageTag)'
              FRONTEND_REF: '$(acrLoginServer)/$(frontendImage):$(imageTag)'
          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)/aks'
              artifact: aks-manifests

  - stage: Deploy
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'), ne(variables['Build.Reason'], 'PullRequest'))
    lockBehavior: sequential
    jobs:
      - deployment: DeployAKS
        environment: aks-employee-app
        timeoutInMinutes: 25
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - download: current
                  artifact: aks-manifests
                - task: KubectlInstaller@0
                  inputs:
                    kubectlVersion: '$(kubectlVersion)'
                - task: AzureCLI@2
                  displayName: Deploy, wait for rollout and test public endpoint
                  inputs:
                    azureSubscription: '$(azureServiceConnection)'
                    scriptType: bash
                    scriptLocation: scriptPath
                    scriptPath: scripts/ci/deploy-aks.sh
                  env:
                    AKS_RESOURCE_GROUP: '$(aksResourceGroup)'
                    AKS_CLUSTER_NAME: '$(aksClusterName)'
                    MANIFEST_DIR: '$(Pipeline.Workspace)/aks-manifests'
                    BACKEND_REF: '$(acrLoginServer)/$(backendImage):$(imageTag)'
                    FRONTEND_REF: '$(acrLoginServer)/$(frontendImage):$(imageTag)'
                    KUBECONFIG: '$(Agent.TempDirectory)/employee-kubeconfig'
