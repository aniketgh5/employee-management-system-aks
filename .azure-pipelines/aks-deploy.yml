trigger:
  batch: true
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

variables:
  azureServiceConnection: 'new'

  # Azure Container Registry
  acrName: 'aniketghoshacr'
  acrLoginServer: 'aniketghoshacr.azurecr.io'

  # Docker Images
  backendImage: 'employee-api'
  frontendImage: 'employee-frontend'

  # Unique immutable image tag
  imageTag: '$(Build.BuildId)-$(Build.SourceVersion)'

pool:
  name: new_agent


stages:

# =========================================================
# STAGE 1 - TEST
# =========================================================

- stage: Test
  displayName: Test

  jobs:

  - job: BackendTests
    displayName: Backend Tests

    steps:

    - checkout: self

    # -----------------------------------------------------
    # Verify build environment
    # -----------------------------------------------------

    - bash: |
        set -euo pipefail

        echo "========================================"
        echo "Checking Build Environment"
        echo "========================================"

        echo ""
        echo "Python:"
        command -v python3
        python3 --version

        echo ""
        echo "PostgreSQL:"
        command -v pg_config
        pg_config --version

        echo ""
        echo "Docker:"
        docker --version

        echo ""
        echo "Build environment verification completed."

      displayName: Verify build dependencies


    # -----------------------------------------------------
    # Backend Tests
    #
    # Temporarily disabled until Python 3.14 dependencies
    # in backend/requirements.txt are updated.
    # -----------------------------------------------------

    # - bash: |
    #     set -euo pipefail
    #
    #     echo "========================================"
    #     echo "Creating Python Virtual Environment"
    #     echo "========================================"
    #
    #     python3 -m venv .venv
    #     source .venv/bin/activate
    #
    #     python --version
    #
    #     python -m pip install \
    #       --upgrade \
    #       pip \
    #       setuptools \
    #       wheel
    #
    #     python -m pip install \
    #       -r backend/requirements.txt
    #
    #     cd backend
    #
    #     python -m pytest \
    #       --junitxml=test-results.xml
    #
    #   displayName: Run backend tests


# =========================================================
# STAGE 2 - BUILD AND PUSH
# =========================================================

- stage: Build
  displayName: Build and Push

  dependsOn: Test

  jobs:

  - job: BuildAndPush
    displayName: Build and Push Docker Images

    steps:

    - checkout: self


    # -----------------------------------------------------
    # Build Docker Images
    # -----------------------------------------------------

    - bash: |
        set -euo pipefail

        echo "========================================"
        echo "Docker Image References"
        echo "========================================"

        echo "Backend:"
        echo "$BACKEND_REF"

        echo ""
        echo "Frontend:"
        echo "$FRONTEND_REF"


        echo ""
        echo "========================================"
        echo "Building Backend Docker Image"
        echo "========================================"

        docker build \
          --pull \
          -f backend/Dockerfile \
          -t "$BACKEND_REF" \
          backend


        echo ""
        echo "========================================"
        echo "Building Frontend Docker Image"
        echo "========================================"

        docker build \
          --pull \
          -f frontend/Dockerfile \
          -t "$FRONTEND_REF" \
          frontend


        echo ""
        echo "Docker images built successfully."

      displayName: Build Docker images

      env:
        BACKEND_REF: '$(acrLoginServer)/$(backendImage):$(imageTag)'
        FRONTEND_REF: '$(acrLoginServer)/$(frontendImage):$(imageTag)'


    # -----------------------------------------------------
    # Push Docker Images to ACR
    # -----------------------------------------------------

    - task: AzureCLI@2
      displayName: Push images to ACR

      condition: >
        and(
          succeeded(),
          eq(variables['Build.SourceBranch'], 'refs/heads/main'),
          ne(variables['Build.Reason'], 'PullRequest')
        )

      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: bash
        scriptLocation: inlineScript

        inlineScript: |
          set -euo pipefail

          echo "========================================"
          echo "Login to Azure Container Registry"
          echo "========================================"

          az acr login \
            --name "$ACR_NAME"


          echo ""
          echo "========================================"
          echo "Push Backend Image"
          echo "========================================"

          docker push "$BACKEND_REF"


          echo ""
          echo "========================================"
          echo "Push Frontend Image"
          echo "========================================"

          docker push "$FRONTEND_REF"


          echo ""
          echo "Images pushed successfully."

      env:
        ACR_NAME: '$(acrName)'
        BACKEND_REF: '$(acrLoginServer)/$(backendImage):$(imageTag)'
        FRONTEND_REF: '$(acrLoginServer)/$(frontendImage):$(imageTag)'


# =========================================================
# STAGE 3 - UPDATE GITOPS MANIFEST
# =========================================================

- stage: UpdateGitOps
  displayName: Update GitOps Manifest

  dependsOn: Build

  condition: >
    and(
      succeeded(),
      eq(variables['Build.SourceBranch'], 'refs/heads/main'),
      ne(variables['Build.Reason'], 'PullRequest')
    )

  jobs:

  - job: UpdateManifest
    displayName: Update Kubernetes Image Tags

    steps:

    # -----------------------------------------------------
    # Checkout repository
    # Keep credentials for git push
    # -----------------------------------------------------

    - checkout: self
      persistCredentials: true
      fetchDepth: 0


    # -----------------------------------------------------
    # Install / Verify Kustomize
    # -----------------------------------------------------

    - bash: |
        set -euo pipefail

        echo "========================================"
        echo "Checking Kustomize"
        echo "========================================"

        if command -v kustomize >/dev/null 2>&1; then

          echo "Kustomize already installed."

        else

          echo "Kustomize not found."
          echo "Installing Kustomize..."

          INSTALL_DIR="$(Agent.TempDirectory)/bin"

          mkdir -p "$INSTALL_DIR"

          curl -s \
            "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" \
            | bash -s -- "$INSTALL_DIR"

          echo "##vso[task.prependpath]$INSTALL_DIR"

          export PATH="$INSTALL_DIR:$PATH"

        fi

        echo ""
        echo "Kustomize version:"
        kustomize version

      displayName: Install and verify Kustomize


    # -----------------------------------------------------
    # Update image tags in kustomization.yaml
    # -----------------------------------------------------

    - bash: |
        set -euo pipefail

        echo "========================================"
        echo "Updating GitOps Image Tags"
        echo "========================================"

        echo ""
        echo "Backend image:"
        echo "$BACKEND_REF"

        echo ""
        echo "Frontend image:"
        echo "$FRONTEND_REF"


        cd aks


        echo ""
        echo "Updating backend image..."

        kustomize edit set image \
          employee-backend-image="$BACKEND_REF"


        echo ""
        echo "Updating frontend image..."

        kustomize edit set image \
          employee-frontend-image="$FRONTEND_REF"


        echo ""
        echo "========================================"
        echo "Updated kustomization.yaml"
        echo "========================================"

        cat kustomization.yaml


        echo ""
        echo "========================================"
        echo "Git Status"
        echo "========================================"

        git status --short


        echo ""
        echo "========================================"
        echo "Commit GitOps Change"
        echo "========================================"

        git config user.name "Azure DevOps Pipeline"
        git config user.email "azure-pipeline@local"

        git add kustomization.yaml


        if git diff --cached --quiet; then

          echo "No image tag changes detected."
          echo "Nothing to commit."

        else

          git commit \
            -m "chore(gitops): deploy build $(Build.BuildId) [skip ci]"


          echo ""
          echo "========================================"
          echo "Push GitOps Change"
          echo "========================================"

          git push origin HEAD:main

        fi

      displayName: Update image tags in Git

      env:
        BACKEND_REF: '$(acrLoginServer)/$(backendImage):$(imageTag)'
        FRONTEND_REF: '$(acrLoginServer)/$(frontendImage):$(imageTag)'


